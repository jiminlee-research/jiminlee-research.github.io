{% include base_path %}

<!-- start custom head snippets -->

<!-- Keep this site, its images and files out of search engines -->
<meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
<meta name="googlebot" content="noindex, nofollow, noimageindex, noarchive">

<!-- Reload the site stylesheet after updates -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v=20261112-10">

<!-- Narrow sans for the sidebar role and affiliation -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap">

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
<link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>


<!-- Mobile: swipe the top menu sideways instead of collapsing it into the ☰ button -->
<style>
@media (max-width: 900px) {
  #site-nav .visible-links { display:flex; width:calc(100% - 40px); max-width:calc(100% - 40px); overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; white-space:nowrap; }
  #site-nav .visible-links::-webkit-scrollbar { display:none; }
  #site-nav .visible-links li { display:block; flex:0 0 auto; }
  #site-nav .visible-links li:first-child { text-wrap:nowrap; }
  #site-nav > button, #site-nav .hidden-links { display:none !important; }
}
</style>

<!-- end custom head snippets -->

<!-- GoatCounter (cookieless visit stats) -->
<script data-goatcounter="https://jiminlee-research.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
